name: Update profile metrics

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - master
      - main

permissions:
  contents: write

jobs:
  metrics:
    runs-on: ubuntu-latest
    steps:
      - name: Generate metrics
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          committer_token: ${{ github.token }}
          output_action: commit
          committer_message: "chore: update profile metrics [skip ci]"
          user: brucerry
          filename: github-metrics.svg
          template: classic
          config_timezone: Asia/Taipei
          config_display: large
          config_order: base.header, isocalendar, languages, lines, repositories
          base: header
          base_indepth: yes
          repositories_affiliations: owner

          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year

          plugin_languages: yes
          plugin_languages_categories: programming
          plugin_languages_colors: github
          plugin_languages_limit: 8
          plugin_languages_sections: most-used
          plugin_languages_details: lines, percentage
          plugin_languages_indepth: yes
          plugin_languages_analysis_timeout: 60

          plugin_lines: yes
          plugin_repositories: yes
          plugin_repositories_featured: brucerry/vscode-server-toolchain-workaround, brucerry/DSA-Template
