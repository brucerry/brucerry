name: Update profile metrics

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - master
      - main

permissions:
  contents: write

jobs:
  metrics:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out profile repository
        uses: actions/checkout@v4

      - name: Generate metrics
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          output_action: none
          user: brucerry
          filename: github-metrics.svg
          template: classic
          config_timezone: Asia/Taipei
          config_display: large
          config_order: base.header, base.activity+community, base.repositories, lines
          base: header, activity, community, repositories
          base_indepth: yes
          repositories: 100
          repositories_affiliations: owner
          repositories_forks: no
          plugin_lines: yes

      - name: Add all owned repository languages
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/add_languages_to_metrics.py /metrics_renders/github-metrics.svg "$RUNNER_TEMP/github-metrics.svg"

      - name: Add LeetCode profile
        run: python3 scripts/add_leetcode_to_metrics.py "$RUNNER_TEMP/github-metrics.svg"

      - name: Publish validated metrics
        shell: bash
        run: |
          set -euo pipefail
          rendered="$RUNNER_TEMP/github-metrics.svg"
          test -s "$rendered"
          if grep -Fq 'No push activity found' "$rendered" ||
             ! grep -Fq 'Languages across repositories' "$rendered" ||
             ! grep -Fq 'class="custom-leetcode"' "$rendered"; then
            echo '::error::Profile metrics are incomplete; keeping the previous SVG.'
            exit 1
          fi

          git fetch origin main
          git rebase origin/main
          cp "$rendered" github-metrics.svg
          git add -- github-metrics.svg
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore: update profile metrics [skip ci]'
          git push origin HEAD:main
