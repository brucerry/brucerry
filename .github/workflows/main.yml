name: Update profile metrics

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - master
      - main

permissions:
  contents: write

jobs:
  metrics:
    runs-on: ubuntu-latest
    steps:
      - name: Generate metrics
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          committer_token: ${{ github.token }}
          output_action: commit
          committer_message: "chore: update profile metrics [skip ci]"
          user: brucerry
          filename: github-metrics.svg
          template: classic
          config_timezone: Asia/Taipei
          config_display: large
          config_order: base.header, base.activity+community, base.repositories, languages, lines, leetcode
          base: header, activity, community, repositories
          base_indepth: yes
          repositories: 20
          repositories_affiliations: owner
          repositories_forks: yes
          commits_authoring: brucerry, bruce, bruce.cheung111@gmail.com, 88369201+brucerry@users.noreply.github.com

          plugin_languages: yes
          plugin_languages_categories: data, markup, programming, prose
          plugin_languages_colors: github
          plugin_languages_limit: 8
          plugin_languages_sections: most-used
          plugin_languages_threshold: 0%
          plugin_languages_skipped: brucerry/BPI-Router-Linux
          plugin_languages_details: lines, percentage
          plugin_languages_indepth: yes
          plugin_languages_analysis_timeout: 15
          plugin_languages_analysis_timeout_repositories: 3

          plugin_lines: yes

          plugin_leetcode: yes
          plugin_leetcode_sections: solved, skills
          plugin_leetcode_user: brucerry
